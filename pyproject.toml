[project]
name = "knowledge-graph-rag"
version = "0.1.0"
description = "Hybrid knowledge-graph + vector RAG over SEC 10-K filings: entity extraction, entity resolution, retrieval routing, grounded answers with validated citations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.4.0",
  "httpx>=0.28.0",
  "neo4j>=5.26.0",
  "pgvector>=0.3.6",
  "psycopg[binary]>=3.2.0",
  "sentence-transformers>=3.0.0",
  "spacy>=3.8.0",
  "langchain-core>=0.3.0",
  "beautifulsoup4>=4.12.0",
  "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.8.0",
  "mypy>=1.15.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["krag*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      GRAPH_BACKEND: real
      VECTOR_BACKEND: real
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
      DATABASE_URL: postgresql://krag:${POSTGRES_PASSWORD:-krag}@postgres:5432/krag
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: krag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-krag}
      POSTGRES_DB: krag
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krag -d krag"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  neo4j-data:
  pg-data:
